name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (unit, security, accessibility, code quality, concurrency, end-to-end, UI flows)
        run: pytest -q --ignore=tests/test_app_streamlit.py --cov=. --cov-report=term-missing:skip-covered
      - name: UI tests in real Streamlit (informational until confirmed green)
        continue-on-error: true
        run: pytest -q tests/test_app_streamlit.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Type check (mypy, settings in mypy.ini)
        run: python -m mypy
      - name: Static security scan (bandit)
        # B608 (SQL text built with f-strings) is skipped on purpose: table and column names come from fixed
        # allow-lists in db.py and every value is a bound parameter. tests/test_authz.py checks the allow-lists.
        run: bandit -q -r . -x ./tests -s B608 -ll
      - name: Known-vulnerable dependencies (informational)
        continue-on-error: true
        run: pip-audit -r requirements.txt
